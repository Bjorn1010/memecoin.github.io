name: Blatja Tweaks (.exe)

on:
  workflow_dispatch:
  push:
    paths: ["blatja-tweaks/**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish blatja-tweaks/BlatjaTweaks.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Blatja-Tweaks
          path: out/Blatja Tweaks.exe
