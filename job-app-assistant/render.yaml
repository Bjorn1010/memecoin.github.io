services:
  - type: web
    name: assistant-candidatures
    env: docker
    plan: free
    dockerfilePath: job-app-assistant/Dockerfile
    dockerContext: job-app-assistant
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PORT
        value: 8787
