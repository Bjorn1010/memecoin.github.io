services:
  - type: web
    name: assistant-candidatures
    env: docker
    plan: free
    dockerfilePath: job-app-assistant/Dockerfile
    dockerContext: job-app-assistant
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: PORT
        value: 8787
