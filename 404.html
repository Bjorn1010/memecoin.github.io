<!DOCTYPE html>
<html lang="fr-CH">
  <head>
    <meta charset="utf-8" />
    <title>Page introuvable — Onze</title>
    <meta content="noindex" name="robots" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#0a0908" name="theme-color" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #0a0908; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      .code { margin: 0; font: 400 clamp(6rem, 24vw, 12rem)/0.9 Impact, 'Arial Narrow Bold', sans-serif; letter-spacing: 0.02em; color: #c9a24a; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.4rem; font-weight: 600; }
      p { margin: 0 auto 1.75rem; max-width: 28rem; color: rgba(255, 255, 255, 0.65); line-height: 1.5; }
      .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a { padding: 0.9rem 1.5rem; border: 1px solid #c9a24a; border-radius: 0.4rem; color: #211a0c; background: #c9a24a; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; font-size: 0.8rem; }
      a.ghost { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.28); }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Ce maillot n'est pas sur le terrain</h1>
      <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
      <div class="links">
        <a href="https://bjorn1010.github.io/memecoin.github.io/onze-store/boutique.html">Voir la boutique</a>
        <a class="ghost" href="https://bjorn1010.github.io/memecoin.github.io/onze-store/">Accueil</a>
      </div>
    </main>
  </body>
</html>
